[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bitnet-fff"
version = "0.1.0"
description = "Hybrid Fast Feedforward (FFF) + BitNet b1.58 layer optimized for Apple Silicon (Metal/MPS)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.0"]

[tool.setuptools.packages.find]
include = ["bitnet_fff*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::FutureWarning"]
